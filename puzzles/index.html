<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crosswords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <nav id="tabs"></nav>
  <button id="theme" aria-label="Switch theme"></button>
</header>
<main>
  <section id="play">
    <h1 id="title"></h1>
    <p id="current-clue"></p>
    <div id="grid-wrap"><div id="grid"></div></div>
    <div id="tools"></div>
    <p id="status"></p>
  </section>
  <section id="clues">
    <div><h2>Across</h2><ol id="across"></ol></div>
    <div><h2>Down</h2><ol id="down"></ol></div>
  </section>
</main>
<input id="keys" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Type letters">
<script type="module" src="js/app.js"></script>
</body>
</html>
